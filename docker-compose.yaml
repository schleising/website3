services:
  fastapi:
    build: fastapi
    depends_on:
      - mongodb
    env_file:
      - .env
    environment:
      - CONVERTER_ART_CACHE_DIR=/var/cache/converter-art
      - SONARR_URL=http://steveds920:8989
      - RADARR_URL=http://steveds920:7878
    volumes:
      - ./website:/app:ro
      - converter_art_cache:/var/cache/converter-art:rw
      - ./website/secrets/arr-keys.txt:/run/secrets/arr-keys.txt:ro
    ports:
      - "8081:8080"
    restart: always
    extra_hosts:
        - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  go-bet-server:
    build: bet
    depends_on:
      - mongodb
    volumes:
      - ./bet/static:/bet_static:ro
      - ./bet/html:/html:ro
    ports:
      - "8888:8020"
    restart: always
    extra_hosts:
        - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build: backend
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/src:ro
      - ./website/static/images/football/crests/wc:/crests/wc:rw
    restart: always
    extra_hosts:
        - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo
    hostname: mongodb
    ports:
      - "27017:27017"
    volumes:
      - db_volume:/data/db:rw
      - db_conf:/data/configdb
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_volume:
  db_conf:
  converter_art_cache:
